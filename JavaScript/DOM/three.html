<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Element in DOM</title>
    <style>
        .style{
            background-color: black;
            color: aliceblue;
        }       
    </style>
</head>
<body class = "style">
    
</body>
<script>
    const div = document.createElement('div');
    console.log(div);

    div.className = "main"
    div.id = Math.round(Math.random()*10+1);
    div.setAttribute("title","generated title") // thisis preferred since direct
    div.style.backgroundColor = "green";
    div.style.padding = "12px";
    
    // div.innerText = "My Code"; or below way
    const addText = document.createTextNode("My Codeeeee");
    div.appendChild(addText);

    document.body.appendChild(div);

</script>
</html>
